services:
  app:
    build:
      context: .
      target: dev
    env_file:
      - .env
    ports:
      - "3000:3000"
    command:
      - sh
      - -c
      - npm run db:migrate && exec npm run dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flags-network
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-flags}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - flags-network

  adminer:
    image: adminer:5.3.0
    profiles:
      - tools
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flags-network

volumes:
  postgres-data:

networks:
  flags-network:
    driver: bridge
